<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- resizes-content: an on-screen keyboard shrinks the page rather than
         covering it, so the box being typed into stays in view. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#fbfcfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171c27" media="(prefers-color-scheme: dark)" />
    <!-- Installable, so an iPhone can add it to the home screen — the only
         place iOS lets a web app send notifications from. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Pergola</title>
    <!-- Latin display + body, and a proper Georgian face so ქართული renders
         in a real font instead of the OS fallback. Geist covers Latin; Noto
         Sans Georgian is picked per-glyph for Georgian text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
